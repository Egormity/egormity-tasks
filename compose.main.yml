# Production ingress on the main Amazi host. The existing Traefik owns TLS.
services:
  web:
    networks: [default, ingress]
    labels:
      traefik.enable: "true"
      traefik.docker.network: amazi-proxy
      traefik.http.routers.amazi-internal-tasks.rule: Host(`tasks.amazi.pro`)
      traefik.http.routers.amazi-internal-tasks.entrypoints: websecure
      traefik.http.routers.amazi-internal-tasks.tls.certresolver: letsencrypt
      traefik.http.routers.amazi-internal-tasks.service: amazi-internal-tasks
      traefik.http.services.amazi-internal-tasks.loadbalancer.server.port: "8080"
networks:
  ingress:
    external: true
    name: amazi-proxy
